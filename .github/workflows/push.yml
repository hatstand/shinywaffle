name: push
on: push
jobs:
  test:
    name: go test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Go test
        run: go test ./...

      - name: Fetch balena CLI
        run: |
          wget -q https://github.com/balena-io/balena-cli/releases/download/v23.1.4/balena-cli-v23.1.4-linux-x64-standalone.tar.gz
          tar -xf balena-cli-v23.1.4-linux-x64-standalone.tar.gz
          echo "$(pwd)/balena/bin" >> $GITHUB_PATH

      - name: Balena login
        run: balena login --token ${{ secrets.BALENA_API_KEY }}

      - name: Build Balena image
        run: balena build . --fleet heating

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        run: balena deploy heating --build --source .
